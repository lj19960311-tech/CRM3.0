<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>销售秘书 · 公铁快线自然语言查询 Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #233047; }
    body { background: #e8eef8; overflow: hidden; }
    #stage { width: 1531px; height: 778px; position: absolute; left: 50%; top: 50%; margin-left: -765.5px; margin-top: -389px; transform-origin: center center; background: #f6f8fb; box-shadow: 0 18px 60px rgba(24,49,92,.18); }
    .workbench { position: absolute; inset: 0; display: flex; background: #eaf2ff; }
    .side { width: 180px; flex: none; background: #fff; border-right: 1px solid #e1e7f1; padding: 18px 8px; }
    .brand { font-size: 17px; font-weight: 750; padding: 1px 9px 27px; color: #26354b; }
    .nav-label { font-size: 11px; font-weight: 700; color: #587099; padding: 10px 9px; }
    .nav-item { font-size: 12px; color: #53647d; padding: 9px 10px; margin: 3px 0; border-radius: 5px; }
    .nav-item.active { color: #1769e8; background: #eaf3ff; font-weight: 650; }
    .main { flex: 1; min-width: 0; }
    .topbar { height: 92px; background: #fff; border-bottom: 1px solid #e2e9f4; }
    .topline { height: 57px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #3f4f64; }
    .topline .right { color: #8795a9; font-size: 12px; }
    .tabs { display: flex; gap: 23px; padding: 7px 14px; border-top: 1px solid #eef1f6; font-size: 12px; color: #62728a; }
    .tabs .active { color: #1769e8; border-bottom: 2px solid #1769e8; padding-bottom: 8px; }
    .dashboard { width: 885px; padding: 21px 16px; }
    .greeting { font-size: 18px; font-weight: 700; margin: 0 0 20px; }
    .board { background: #fff; border-radius: 10px; padding: 17px; box-shadow: 0 2px 9px rgba(40,79,129,.04); }
    .board-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
    .status-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .status-card { height: 260px; border: 1px solid #e4e9f1; border-radius: 9px; overflow: hidden; }
    .status-card strong { display: block; padding: 11px 13px; background: #f5f8fd; font-size: 13px; }
    .stat-row { padding: 15px 13px; color: #8290a4; font-size: 11px; border-bottom: 1px solid #edf1f6; }
    .stat-value { display: block; margin-top: 10px; color: #66758c; font-size: 24px; font-weight: 700; }
    .insight { background: #f2f6ff; margin-top: 13px; border-radius: 8px; padding: 14px; font-size: 12px; color: #7f8da2; line-height: 1.9; }
    .lower { display: flex; gap: 14px; margin-top: 14px; }
    .lower div { width: 50%; height: 110px; border-radius: 9px; background: #fff; padding: 14px; font-size: 13px; font-weight: 700; }
    .assistant { position: absolute; left: 1065px; top: 109px; width: 400px; height: 613px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #acc8ff; border-radius: 11px; background: #fff; box-shadow: 0 12px 32px rgba(37,88,161,.18); transition: left .2s ease, width .2s ease; }
    .assistant.expanded { left: 825px; width: 640px; }
    .assistant-header { height: 56px; padding: 0 16px; background: linear-gradient(90deg,#b9d2ff,#a6c4ff); display: flex; align-items: center; gap: 10px; flex: none; }
    .avatar { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 16px; background: #2867e9; border: 2px solid #fff; }
    .assistant-header strong { font-size: 17px; color: #19253c; }
    .demo-tag { margin-left: 2px; font-size: 11px; color: #325caa; background: rgba(255,255,255,.7); border-radius: 10px; padding: 2px 7px; }
    .header-spacer { flex: 1; }
    .header-btn { width: 27px; height: 27px; padding: 0; border: 0; background: transparent; font-size: 19px; color: #314761; cursor: pointer; }
    .chat { min-height: 0; flex: 1; overflow: auto; padding: 14px 15px 18px; background: #fff; }
    .welcome { border: 1px solid #e4eaf5; border-radius: 11px; padding: 14px; background: #fbfcff; }
    .welcome-title { font-size: 15px; font-weight: 700; margin-bottom: 7px; }
    .welcome p { margin: 0; font-size: 12px; line-height: 1.65; color: #64748b; }
    .examples { display: grid; gap: 7px; margin-top: 13px; }
    .example { text-align: left; border: 1px solid #d7e4ff; background: #fff; border-radius: 8px; color: #245cbd; padding: 8px 10px; font-size: 12px; line-height: 1.4; cursor: pointer; }
    .example:hover { background: #eef5ff; }
    .msg { margin: 12px 0; font-size: 12px; line-height: 1.55; }
    .msg.user { margin-left: 42px; padding: 9px 11px; background: #eaf2ff; border-radius: 10px 10px 3px 10px; word-break: break-word; }
    .msg.assistant-text { margin-right: 32px; color: #526078; }
    .result { margin: 10px 0 18px; border: 1px solid #d8e5fb; border-radius: 12px; padding: 13px; background: #fff; box-shadow: 0 4px 12px rgba(37,88,161,.05); }
    .result-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
    .result-title small { font-size: 10px; font-weight: 500; color: #6f82a4; white-space: nowrap; }
    .route { font-size: 16px; font-weight: 750; margin: 12px 0 9px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 12px; }
    .chip { background: #eaf2ff; color: #2464c7; border-radius: 12px; padding: 3px 8px; font-size: 10px; }
    .result-detail { background: #f5f8fd; padding: 9px 10px; border-radius: 8px; color: #526078; font-size: 11px; line-height: 1.65; }
    .map { position: relative; height: 150px; margin-top: 12px; overflow: hidden; border: 1px solid #dde7ea; border-radius: 9px; background: #eef3f2; }
    .map svg { width: 100%; height: 100%; }
    .map-label { position: absolute; top: 7px; left: 9px; background: rgba(255,255,255,.92); color: #455870; padding: 3px 7px; border-radius: 5px; font-size: 10px; }
    .lead-button { width: 100%; margin-top: 12px; background: #276df2; border: none; color: #fff; border-radius: 8px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .lead-button:hover { background: #1859cf; }
    .info { margin-top: 12px; border-top: 1px solid #e6ebf3; padding-top: 10px; }
    .info strong { font-size: 11px; }
    .info p { color: #6d7b90; font-size: 10px; line-height: 1.55; margin: 5px 0 9px; }
    .param-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 355px; font-size: 9px; text-align: center; }
    th, td { padding: 5px 3px; border-bottom: 1px solid #e8ecf3; white-space: nowrap; }
    th { background: #f0f4fb; font-weight: 650; }
    .note { font-size: 9px; color: #9ba8b8; margin-top: 5px; }
    .composer { flex: none; border-top: 1px solid #e4e9f4; padding: 9px 13px 10px; background: #fff; }
    .quick-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .quick-tools span { font-size: 10px; border: 1px solid #dce4f2; border-radius: 14px; padding: 3px 8px; color: #53647f; }
    .quick-tools .active { color: #2265ce; border-color: #99c1ff; background: #f4f8ff; }
    .input-wrap { border: 1px solid #dbe3ef; border-radius: 10px; padding: 8px 9px; }
    textarea { display: block; width: 100%; height: 37px; resize: none; border: 0; outline: 0; font: inherit; font-size: 12px; line-height: 1.5; }
    textarea::placeholder { color: #9aa7b9; }
    .input-actions { display: flex; justify-content: space-between; align-items: center; }
    .input-actions .hint { font-size: 10px; color: #a4afbf; }
    .send { border: 0; border-radius: 50%; width: 27px; height: 27px; color: #fff; background: #2d70ef; font-size: 16px; cursor: pointer; }
    .footer-note { font-size: 9px; color: #aab2c0; text-align: center; padding-top: 6px; }
    .toast { position: absolute; right: 22px; bottom: 156px; max-width: 340px; padding: 10px 12px; border-radius: 8px; background: #263754; color: #fff; font-size: 11px; box-shadow: 0 8px 22px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="workbench" aria-hidden="true">
      <nav class="side"><div class="brand">销售管理</div><div class="nav-label">工作台</div><div class="nav-item active">销售管理工作台</div><div class="nav-item">线索管理</div><div class="nav-item">营销工具</div><div class="nav-item">企业档案</div><div class="nav-item">生态营销产品</div></nav>
      <div class="main"><div class="topbar"><div class="topline"><span>销售管理工作台</span><span class="right">消息　通知　设置</span></div><div class="tabs"><span class="active">销售管理工作台</span><span>企业线索</span><span>企业档案</span></div></div>
        <div class="dashboard"><div class="greeting">你好，销售同事</div><div class="board"><div class="board-title">经营状态　<span style="font-size:11px;font-weight:400;color:#9aa7b8">演示占位</span></div><div class="status-grid"><div class="status-card"><strong>易达宝签收单</strong><div class="stat-row">签收单量<span class="stat-value">—</span></div><div class="stat-row">毛利<span class="stat-value">—</span></div></div><div class="status-card"><strong>网络货运</strong><div class="stat-row">履约运单量<span class="stat-value">—</span></div><div class="stat-row">毛利<span class="stat-value">—</span></div></div><div class="status-card"><strong>多式联运</strong><div class="stat-row">履约运单量<span class="stat-value">—</span></div><div class="stat-row">毛利<span class="stat-value">—</span></div></div></div><div class="insight">经营达成洞察<br>此处仅还原工作台布局，不展示真实业务数据。</div></div><div class="lower"><div>重点机会</div><div>跟进行为洞察</div></div></div>
      </div>
    </div>
    <aside class="assistant" id="assistant" aria-label="营销智能体对话窗口">
      <header class="assistant-header">
        <div class="avatar">✦</div><strong>营销智能体</strong><span class="demo-tag">Demo</span>
        <div class="header-spacer"></div><button class="header-btn" id="expand" title="展开或收起">⛶</button>
      </header>
      <div class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-title">公铁快线查询</div>
          <p>直接在下方输入起点和终点。货品、重量、箱型可以后续补充。</p>
          <div class="examples">
            <button class="example" data-prompt="北京到成都走铁路集装箱多少钱">北京到成都走铁路集装箱多少钱</button>
            <button class="example" data-prompt="天津到重庆的班列怎么走">天津到重庆的班列怎么走</button>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="quick-tools"><span>物流方案助手</span><span class="active">公铁快线查询</span><span>展开更多⌄</span></div>
        <div class="input-wrap">
          <textarea id="prompt" placeholder="请输入公铁快线查询问题…" aria-label="输入公铁快线查询问题"></textarea>
          <div class="input-actions"><span class="hint">Enter 发送 · Shift+Enter 换行</span><button class="send" id="send" title="发送">↑</button></div>
        </div>
        <div class="footer-note">演示数据仅供参考，路线与报价以正式接口返回为准</div>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </aside>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const chat = document.getElementById('chat');
    const prompt = document.getElementById('prompt');
    const assistant = document.getElementById('assistant');
    const toast = document.getElementById('toast');
    function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1531, innerHeight / 778)})`; }
    addEventListener('resize', fit); fit();

    document.querySelectorAll('.example').forEach(button => button.addEventListener('click', () => {
      prompt.value = button.dataset.prompt; prompt.focus();
    }));
    document.getElementById('expand').addEventListener('click', () => assistant.classList.toggle('expanded'));
    document.getElementById('send').addEventListener('click', send);
    prompt.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); } });

    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 3600);
    }
    function addMessage(text, type) {
      const node = document.createElement('div'); node.className = `msg ${type}`; node.textContent = text;
      chat.appendChild(node); chat.scrollTop = chat.scrollHeight;
    }
    function parseExample(text) {
      if (/北京.{0,8}成都/.test(text) && /铁路|集装箱|班列|公铁/.test(text)) return { from: '北京', to: '成都', intent: 'price' };
      if (/天津.{0,8}重庆/.test(text) && /铁路|集装箱|班列|公铁/.test(text)) return { from: '天津', to: '重庆', intent: 'route' };
      return null;
    }
    function send() {
      const text = prompt.value.trim(); if (!text) return;
      prompt.value = '';
      document.getElementById('welcome')?.remove();
      addMessage(text, 'user');
      const query = parseExample(text);
      if (!query) { addMessage('演示当前支持两条示例问题：北京到成都走铁路集装箱多少钱；天津到重庆的班列怎么走。', 'assistant-text'); return; }
      addMessage(`已识别 ${query.from} → ${query.to} 的公铁快线查询。下面展示结果与地图的交互示意。`, 'assistant-text');
      const card = document.createElement('div'); card.className = 'result';
      card.innerHTML = `<div class="result-title"><span>公铁快线查询结果</span><small>交互演示</small></div>
        <div class="route">${query.from} → ${query.to}</div>
        <div class="chips"><span class="chip">40(77)</span><span class="chip">45</span><span class="chip">50</span><span class="chip">未指定箱型：查询全部</span></div>
        <div class="result-detail">${query.intent === 'price' ? '报价：待接口返回<br>线路：待接口返回' : '班列线路：待接口返回<br>报价：待接口返回'}<br>本 Demo 不生成真实报价或班列方案。</div>
        <div class="map"><span class="map-label">路线地图 · 示意</span><svg viewBox="0 0 360 150" aria-label="${query.from}到${query.to}的示意地图"><path d="M0 28H360M0 75H360M0 125H360M60 0V150M168 0V150M280 0V150" stroke="#dce5e7" stroke-width="2" fill="none"/><path d="M44 111C110 82 144 107 202 60S285 80 318 31" stroke="#2875ef" stroke-width="5" fill="none"/><circle cx="44" cy="111" r="7" fill="#1eaa74" stroke="white" stroke-width="3"/><circle cx="318" cy="31" r="7" fill="#f17c38" stroke="white" stroke-width="3"/><text x="21" y="136" font-size="12" fill="#31445d">${query.from}</text><text x="290" y="20" font-size="12" fill="#31445d">${query.to}</text></svg></div>
        <button class="lead-button" type="button">创建线索</button>
        <div class="info"><strong>使用说明</strong><p>在对话中说出起点与终点即可查询；货品、重量与箱型可继续补充。结果与地图对应同一次查询。</p><strong>适用箱型参数</strong><div class="param-wrap"><table><thead><tr><th>箱型</th><th>长×宽×高 (mm)</th><th>载重 (吨)</th><th>容积 (m³)</th></tr></thead><tbody><tr><td>40(77)</td><td>12029×2464×2698</td><td>31</td><td>79</td></tr><tr><td>45</td><td>13556×2464×2698</td><td>29</td><td>90</td></tr><tr><td>50</td><td>15098×2796×2718</td><td>30</td><td>114</td></tr></tbody></table></div><div class="note">参数沿用旧截图作示意，正式口径待确认。</div></div>`;
      card.querySelector('.lead-button').addEventListener('click', () => showToast('演示环境未连接 CRM 接口，未实际创建线索。'));
      chat.appendChild(card);
      requestAnimationFrame(() => { chat.scrollTop += card.getBoundingClientRect().top - chat.getBoundingClientRect().top; });
    }
  </script>
</body>
</html>
